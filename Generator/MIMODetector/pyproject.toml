[project]
name = "mimo-latency-evaluation"
version = "0.1.0"
description = "Parameter-driven RTL latency evaluation for the MIMO detector"
requires-python = ">=3.10"
dependencies = [
    "joblib>=1.3",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "pytest>=8.0",
    "scikit-learn>=1.3.2",
    "scipy>=1.10",
    "sympy>=1.12",
    "pyverilog>=1.3",
]

[tool.pytest.ini_options]
testpaths = ["BehaviorialVerification"]

