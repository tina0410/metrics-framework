[project]
name = "metrics-framework"
version = "0.1.0"
description = "Extensible isolated metric evaluation framework"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
metrics = "metrics_framework.cli:main"

[tool.setuptools]
packages = ["metrics_framework", "metrics_framework.adapters"]

[tool.setuptools.package-data]
metrics_framework = ["registry.json", "README.md"]

[tool.pytest.ini_options]
testpaths = ["test_metrics_framework.py"]
python_files = ["test_metrics_framework.py"]
norecursedirs = ["Generator", "BPPredIter", ".venv*", ".lsce-tools", "evaluation_output"]
